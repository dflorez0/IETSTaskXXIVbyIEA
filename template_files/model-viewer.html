<!--
  Model viewer: renders every <div class="model-viewer"> left in the page by the
  model-viewer shortcode (model-viewer.lua), from the model's JSON description.

  A model page places one view per section:
    card        model card from the metadata
    summary     key figures, with the unit selector and the scale factor f
    flows       black-box diagram: connectors in and out, heat demand and release
    equations   every calculated variable as an equation, from its JSON formula
    variables   input and calculated variables
    unit        unit description, connectors, equipment and operating costs
    streams     heat stream table (hot rows red, cold rows blue) and data checks
    cc / gcc    composite curves / grand composite curve
    references  references listed in the metadata
  Without a view the shortcode renders a compact tabbed widget.

  Variables are linked everywhere: inline code in the page that names a
  variable, table values that come from a variable's formula, and symbols in
  rendered formulas show a hover card with the definition, and link to the
  variable's row in the variables table.

  Reads both JSON layouts of the database: the Excel export (METADATA,
  VARIABLES, UNITS: {name: {...}}) and the Lua export (header, variables,
  units: [...]). The pinch cascade and the plots are ported from the "Model
  Representation and Integration" prototype.
-->
<style>

.mv-kind { font-size: .7rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;

.mv-kind.is-process { background: #e8f5e9; color: #1e8449; }
.mv-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: .55rem; }
.mv-stat { border: 1px solid #dee2e6; border-radius: 6px; padding: .45rem .7rem; background: #fff; }
.mv-stat-label { font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; color: #7f8c9b; }

.mv-tabs { display: flex; flex-wrap: wrap; border-bottom: 1px solid #dee2e6; margin: 1.1rem 0 .9rem; }

          margin-bottom: -1px; font-size: .88rem; cursor: pointer; border-radius: 5px 5px 0 0; }
.mv-tab:hover { color: #ff0000; }
.mv-tab.is-active { border-color: #dee2e6; background: #fff; color: #212121; font-weight: 600; }
.mv-panel[hidden] { display: none !important; }

.mv-frame { position: relative; border: 1px solid #dee2e6; border-radius: 6px; background: #fafbfc; padding: .5rem; overflow-x: auto; }
.mv-frame svg { display: block; width: 100%; height: auto; margin: 0 auto; }
.mv-frame canvas { display: block; margin: 0 auto; }
.mv-tools { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; margin-top: .4rem; font-size: .8rem; color: #7f8c9b; }
.mv-tools p { margin: 0; text-align: left !important; }
.mv-dl { border: 1px solid #ced4da; background: #fff; color: #444; border-radius: 4px; padding: .15rem .55rem; font-size: .78rem; cursor: pointer; white-space: nowrap; }
.mv-dl:hover { border-color: #ff0000; color: #ff0000; }
.mv-collapsed .mv-extra { display: none; }
.mv-more { display: block; width: 100%; margin: .5rem 0 0; border: 1px solid #ff0000; background: #fff5f5; color: #d00000; border-radius: 4px; padding: .4rem .9rem; font-size: .85rem; font-weight: 600; cursor: pointer; }
.mv-more:hover { background: #ff0000; color: #fff; }
.mv-scaled { font-size: .8rem; color: #b8860b; margin-bottom: .35rem; }
.mv-tip { position: absolute; pointer-events: none; z-index: 5; background: rgba(33,33,33,.92); color: #fff; font-size: .75rem;
          line-height: 1.35; padding: .3rem .5rem; border-radius: 4px; white-space: nowrap; transform: translate(-50%, calc(-100% - 10px)); }

          border: 2px solid #212121; border-radius: 50%; background: #fff; }

.mv-table { width: 100%; border-collapse: collapse; font-size: .82rem; display: table !important; }
.mv-table th { background: #f0f1f4; color: #555; font-weight: 600; font-size: .78rem; padding: .4rem .5rem;
          border-bottom: 1px solid #d8dce3; text-align: right; white-space: nowrap; }
.mv-table td { padding: .32rem .5rem; border-bottom: 1px solid #e6e8ec; text-align: right; font-variant-numeric: tabular-nums; vertical-align: top; }
.mv-table .l, .mv-table th.l { text-align: left !important; }
.mv-table td.wrap { white-space: normal; min-width: 8rem; }
.mv-table td.mv-def { min-width: 11rem; }
.mv-table td.mv-def mjx-container[display="true"] { margin: 0 !important; text-align: left !important; font-size: 85%; }

.mv-dir-out { color: #1e8449; font-weight: 600; }
.mv-badge { display: inline-block; font-size: .68rem; text-transform: lowercase; padding: .05rem .4rem; border-radius: 3px;
          background: #eef0f3; color: #555; white-space: nowrap; }
.mv-badge.calc { background: #fff3e0; color: #a35a00; }
.mv-muted { color: #7f8c9b; }
.mv-warn { margin: .6rem 0 0; padding: .45rem .7rem; border-left: 3px solid #ca6f1e; background: #fdf5ec; font-size: .82rem; }
.mv-warn ul { margin: .2rem 0 0; padding-left: 1.1rem; }
.mv-flag { color: #ca6f1e; cursor: help; margin-left: .25rem; }
.mv-empty { color: #7f8c9b; font-size: .9rem; padding: 1.25rem; text-align: center; }

.mv-legend { font-size: .8rem; color: #7f8c9b; margin: 0 0 .5rem; }

/* model card */
.mv-kv { width: 100%; border-collapse: collapse; font-size: .9rem; display: table !important; }
.mv-kv th { width: 13rem; text-align: left; font-weight: 600; padding: .35rem .6rem; vertical-align: top; background: #f6f7f9; border-bottom: 1px solid #e6e8ec; }

/* linked variables */

a.mv-val:hover { color: #ff0000; }

.mv-card { position: fixed; z-index: 1100; max-width: min(440px, calc(100vw - 16px)); background: #fff; border: 1px solid #d8dce3; border-radius: 6px;
          box-shadow: 0 6px 22px rgba(0,0,0,.14); padding: .55rem .75rem; font-size: .82rem; line-height: 1.4; pointer-events: none; }

@keyframes mvflash { from { background: #fff3b0; } to { background: transparent; } }

</style>
<script>
document.addEventListener("DOMContentLoaded", function () {
  "use strict";

  // Plots and diagrams are lettered in the page's own font, read from the page at start.
  var FONT = '"Source Sans Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
  var MATHJAX_URL = "https://cdn.jsdelivr.net/npm/mathjax@4/tex-chtml.js";
  var PHASE_CHANGE_DT = 0.01;   // isothermal streams get a sliver of span so CP is finite
  var C = { text: "#2C3E50", muted: "#7F8C9B", border: "#D8DCE3", bg: "#FAFBFC", card: "#FFFFFF",
            hot: "#D9453D", cold: "#2980B9", out: "#27AE60", pinch: "#B8860B", grid: "#E8ECF0" };

  // ================================================================ helpers
  function val(x) { return (x && typeof x === "object" && "value" in x) ? x.value : x; }
  function num(x) { var v = val(x); if (v === null || v === "" || v === undefined) return NaN; v = Number(v); return isFinite(v) ? v : NaN; }
  function str(x) { var v = val(x); return v == null ? "" : String(v); }
  function blank(s) { s = String(s == null ? "" : s).trim(); return s === "" || s === "-"; }
  function fmt(n, d) { var v = Number(n); return isFinite(v) ? v.toFixed(d) : "-"; }
  // Flows span watts to tonnes per hour: keep 4-5 significant figures, group thousands.
  function nice(v) {
    if (!isFinite(v)) return "-";
    var a = Math.abs(v), d = a >= 1000 ? 0 : a >= 100 ? 1 : a >= 10 ? 2 : a >= 1 ? 3 : a >= 0.01 ? 4 : 6;
    return v.toLocaleString("en-US", { maximumFractionDigits: d, minimumFractionDigits: 0 });
  }
  function xesc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function prettyUnit(u) {
    return String(u || "").replace(/\bNm3\b/g, "Nm³").replace(/\bm3\b/g, "m³").replace(/\bm2\b/g, "m²").replace(/\bm2K\b/g, "m²K");
  }
  // A digit straight after a letter is a subscript: CO2, H2O, C2H4.
  function chemHTML(s) { return xesc(s).replace(/([A-Za-z)\]])(\d+)/g, "$1<sub>$2</sub>"); }
  function chemSVG(s) {
    var out = "", back = 0, i = 0, buf = "";
    s = String(s);
    function flush() {
      if (!buf) return;
      out += "<tspan" + (back ? ' dy="' + back + '"' : "") + ">" + xesc(buf) + "</tspan>";
      back = 0; buf = "";
    }
    while (i < s.length) {
      if (/[0-9]/.test(s[i]) && i > 0 && /[A-Za-z)\]]/.test(s[i - 1])) {
        var j = i; while (j < s.length && /[0-9]/.test(s[j])) j++;
        flush();
        out += '<tspan font-size="76%" dy="2.2">' + xesc(s.slice(i, j)) + "</tspan>";
        back = -2.2; i = j;
      } else { buf += s[i]; i++; }
    }
    flush();
    if (back) out += '<tspan dy="' + back + '"></tspan>';
    return out;
  }
  function linkify(s) {
    return xesc(s).replace(/(https?:\/\/[^\s;,)]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  }
  function download(name, content, mime) {
    var a = document.createElement("a");
    a.download = name;
    a.href = typeof content === "string" && content.indexOf("data:") === 0
      ? content : URL.createObjectURL(new Blob([content], { type: mime }));
    document.body.appendChild(a); a.click(); a.remove();
  }
  function slug(s) { return String(s).replace(/[^A-Za-z0-9_.-]+/g, "_"); }
  // The formula behind a JSON value, when it is a formula on the model's own variables.
  function fOf(x) {
    var f = x && typeof x === "object" ? x.formula : null;
    if (f == null) return "";
    f = String(f).trim().replace(/^=/, "").trim();
    return /!|^[<>]{2}/.test(f) ? "" : f;   // other sheets or simulator paths
  }

  // ======================================================= formula -> LaTeX
  function tokenize(s) {
    var t = [], i = 0, m;
    while (i < s.length) {
      var c = s[i], rest = s.slice(i);
      if (/\s/.test(c)) { i++; continue; }
      if ((m = rest.match(/^(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?/))) { t.push({ k: "num", v: m[0] }); i += m[0].length; continue; }
      if ((m = rest.match(/^[A-Za-z_][A-Za-z0-9_]*(\.[A-Za-z_][A-Za-z0-9_]*)*/))) { t.push({ k: "id", v: m[0] }); i += m[0].length; continue; }
      if (rest.indexOf("**") === 0) { t.push({ k: "op", v: "^" }); i += 2; continue; }
      if ("+-*/^(),".indexOf(c) >= 0) { t.push({ k: "op", v: c }); i++; continue; }
      throw new Error("unexpected character " + c);
    }
    return t;
  }
  function parseFormula(s) {
    var t = tokenize(s), p = 0;
    function isOp(v) { return t[p] && t[p].k === "op" && t[p].v === v; }
    function eat(v) { if (!isOp(v)) throw new Error("expected " + v); p++; }
    function expr() {
      var terms = [{ sign: "+", n: term() }];
      while (isOp("+") || isOp("-")) { var sg = t[p++].v; terms.push({ sign: sg, n: term() }); }
      return terms.length === 1 ? terms[0].n : { k: "sum", terms: terms };
    }
    function term() {
      var fs = [{ op: "*", n: unary() }];
      while (isOp("*") || isOp("/")) { var o = t[p++].v; fs.push({ op: o, n: unary() }); }
      return fs.length === 1 ? fs[0].n : { k: "prod", fs: fs };
    }
    function unary() {
      if (isOp("-")) { p++; return { k: "neg", n: unary() }; }
      if (isOp("+")) { p++; return unary(); }
      var b = atom();
      if (isOp("^")) { p++; return { k: "pow", b: b, e: unary() }; }
      return b;
    }
    function atom() {
      var x = t[p];
      if (!x) throw new Error("unexpected end");
      if (x.k === "num") { p++; return { k: "num", v: x.v }; }
      if (x.k === "id") {
        p++;
        if (isOp("(")) {
          p++;
          var args = [];
          if (!isOp(")")) { args.push(expr()); while (isOp(",")) { p++; args.push(expr()); } }
          eat(")");
          return args.length ? { k: "fn", f: x.v, args: args } : { k: "id", v: x.v };   // Lua: water_flow()
        }
        return { k: "id", v: x.v };
      }
      if (isOp("(")) { p++; var e = expr(); eat(")"); return { k: "par", n: e }; }
      throw new Error("unexpected " + x.v);
    }
    var r = expr();
    if (p < t.length) throw new Error("unexpected " + t[p].v);
    return r;
  }
  function strip(n) { return n.k === "par" ? strip(n.n) : n; }
  function isAtom(n) { return n.k === "num" || n.k === "id" || n.k === "fn"; }
  function toTex(node, varTex) {
    function L(n) {
      switch (n.k) {
        case "num": return n.v.replace(/^(.*?)[eE]([+-]?\d+)$/, function (_m, a, e) { return a + "\\times 10^{" + Number(e) + "}"; });
        case "id": return varTex(n.v);
        case "par": return "\\left(" + L(n.n) + "\\right)";
        case "neg": { var c = strip(n.n); return "-" + (c.k === "sum" ? "\\left(" + L(c) + "\\right)" : L(c)); }
        case "sum": return n.terms.map(function (tm, i) {
          var c = strip(tm.n), s = L(c);
          if (tm.sign === "-" && (c.k === "sum" || c.k === "neg")) s = "\\left(" + s + "\\right)";
          return (i === 0 ? (tm.sign === "-" ? "-" : "") : (tm.sign === "-" ? " - " : " + ")) + s;
        }).join("");
        case "prod": {
          // consecutive divisions form one fraction: a/b/c*d/e -> \frac{a}{b c} \cdot \frac{d}{e}
          var groups = [], cur = null;
          n.fs.forEach(function (f) { if (f.op === "*") { cur = { num: [f.n], den: [] }; groups.push(cur); } else cur.den.push(f.n); });
          return groups.map(function (g) {
            return g.den.length ? "\\frac{" + factors(g.num) + "}{" + factors(g.den) + "}" : factor(g.num[0]);
          }).join(" \\cdot ");
        }
        case "pow": {
          var b = strip(n.b), bs = L(b);
          if (!isAtom(b)) bs = "\\left(" + bs + "\\right)";
          else if (b.k === "id") bs = "{" + bs + "}";
          return bs + "^{" + L(strip(n.e)) + "}";
        }
        case "fn": {
          var f = n.f.toLowerCase().replace(/^math\./, ""), a = n.args.map(function (x) { return L(strip(x)); });
          if (f === "sqrt") return "\\sqrt{" + a[0] + "}";
          if (f === "atan" || f === "arctan") return "\\arctan\\left(" + a[0] + "\\right)";
          if (f === "sin" || f === "cos" || f === "tan") return "\\" + f + "\\left(" + a[0] + "\\right)";
          if (f === "exp") return "e^{" + a[0] + "}";
          if (f === "ln" || f === "log") return "\\ln\\left(" + a[0] + "\\right)";
          if (f === "log10") return "\\log_{10}\\left(" + a[0] + "\\right)";
          if (f === "abs") return "\\left|" + a[0] + "\\right|";
          if (f === "min" || f === "max") return "\\" + f + "\\left(" + a.join(",\\, ") + "\\right)";
          if (f === "pow") return "{" + a[0] + "}^{" + a[1] + "}";
          if (f === "round") return a[0];
          return "\\operatorname{" + n.f.replace(/_/g, "\\_") + "}\\left(" + a.join(",\\, ") + "\\right)";
        }
      }
      return "";
    }
    function factor(x) { var s = strip(x); return (s.k === "sum" || s.k === "neg") ? "\\left(" + L(s) + "\\right)" : L(s); }
    function factors(arr) { return arr.length === 1 ? L(strip(arr[0])) : arr.map(factor).join(" \\cdot "); }
    return L(node);
  }
  // Rough printed width of a LaTeX fragment, in characters.
  function vlen(t) {
    return t.replace(/\\href\{[^}]*\}/g, "").replace(/\\(mathrm|operatorname|left|right|dot)\b/g, "")
      .replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g, function (_m, a, b) { return a.length > b.length ? a : b; })
      .replace(/\\(cdot|times)/g, "x").replace(/\\(arctan|sin|cos|tan|ln|log|min|max)/g, "atan").replace(/\\sqrt/g, "r")
      .replace(/\\[,;!]/g, "").replace(/\\[A-Za-z]+/g, "x").replace(/[{}_^]/g, "").length;
  }
  // A long top-level sum or product split into lines of about maxLen characters.
  function toTexLines(node, varTex, maxLen) {
    var n = strip(node), pieces = [];
    // a product breaks between its factors (a fraction stays whole)
    function prodPieces(p, lead) {
      var groups = [];
      p.fs.forEach(function (f) { if (f.op === "*") groups.push([f]); else groups[groups.length - 1].push(f); });
      return groups.map(function (g, i) {
        var s;
        if (g.length > 1) s = toTex({ k: "prod", fs: g }, varTex);
        else {
          var c = strip(g[0].n);
          s = (c.k === "sum" || c.k === "neg") ? "\\left(" + toTex(c, varTex) + "\\right)" : toTex(c, varTex);
        }
        return (i ? "\\cdot " : lead) + s;
      });
    }
    if (n.k === "sum") {
      n.terms.forEach(function (tm, i) {
        var c = strip(tm.n), s = toTex(c, varTex);
        var lead = i === 0 ? (tm.sign === "-" ? "-" : "") : (tm.sign === "-" ? "- " : "+ ");
        if (tm.sign === "-" && (c.k === "sum" || c.k === "neg")) s = "\\left(" + s + "\\right)";
        // a term too long for one line breaks between its own factors
        if (vlen(s) > maxLen && c.k === "prod") pieces = pieces.concat(prodPieces(c, lead));
        else pieces.push(lead + s);
      });
    } else if (n.k === "prod") pieces = prodPieces(n, "");
    else return [toTex(n, varTex)];
    var lines = [], cur = "", len = 0;
    pieces.forEach(function (p) {
      var l = vlen(p);
      if (cur && len + l > maxLen) { lines.push(cur); cur = p; len = l; }
      else { cur += (cur ? " " : "") + p; len += l; }
    });
    if (cur) lines.push(cur);
    return lines;
  }
  // Evaluate a parsed formula with the stored values of the variables it uses.
  function evalFormula(node, lookup) {
    function E(n) {
      switch (n.k) {
        case "num": return Number(n.v);
        case "id": return lookup(n.v);
        case "par": return E(n.n);
        case "neg": return -E(n.n);
        case "sum": return n.terms.reduce(function (a, t) { return a + (t.sign === "-" ? -1 : 1) * E(t.n); }, 0);
        case "prod": return n.fs.reduce(function (a, f) { return f.op === "*" ? a * E(f.n) : a / E(f.n); }, 1);
        case "pow": return Math.pow(E(n.b), E(n.e));
        case "fn": {
          var f = n.f.toLowerCase().replace(/^math\./, ""), a = n.args.map(E);
          var fns = { sqrt: Math.sqrt, atan: Math.atan, arctan: Math.atan, sin: Math.sin, cos: Math.cos, tan: Math.tan,

                  (i === 0 ? '<td class="l" rowspan="' + ps.length + '">' + xesc(e.reference) + "</td>" : "") + "</tr>";
              }).join("");
            }).join("") + "</tbody>" + TCLOSE + "</div>";
        }
        if (u.opcost.length) {
          h += (u.ocDesc ? '<p class="mv-legend" style="margin-top:1rem">' + xesc(u.ocDesc) + "</p>" : "") +
            '<div style="overflow-x:auto' + (u.ocDesc ? "" : ";margin-top:1rem") + '">' + TOPEN + ' class="mv-table"><caption>Operating costs</caption><tbody>' +
            u.opcost.map(function (q) {
              var n = Number(q.value), v = (q.value !== null && q.value !== "" && isFinite(n)) ? nice(n) : xesc(q.value == null ? "-" : q.value);
              return '<tr><td class="l">' + xesc(q.name) + "</td><td>" + linked(entry, v, q.f) + '</td><td class="l">' + unitText(q.unit) + "</td></tr>";
            }).join("") + "</tbody>" + TCLOSE + "</div>";
        }
        el.innerHTML = h;
      };
    },

    references: function (entry, el) {
      var r = entry.model.meta.references;
      if (blank(r)) { el.innerHTML = '<div class="mv-empty">No references in the metadata.</div>'; return; }
      var items = r.split(/;?\s*\n|;\s*(?=\[\d+\])/).map(function (s) { return s.trim().replace(/^\[\d+\]\s*/, "").replace(/;$/, ""); }).filter(Boolean);
      el.innerHTML = '<ol class="mv-refs">' + items.map(function (s) { return "<li>" + linkify(s) + "</li>"; }).join("") + "</ol>";
    },

    all: function (entry, el, view) {
      var TABS = [["flows", "Flows"], ["streams", "Heat streams"], ["cc", "Composite curves"], ["gcc", "Grand composite curve"]];
      el.innerHTML = '<div class="mv-slot-summary"></div><div class="mv-tabs" role="tablist">' + TABS.map(function (t) {
          return '<button type="button" class="mv-tab" role="tab" data-tab="' + t[0] + '">' + t[1] + "</button>"; }).join("") + "</div>" +
        TABS.map(function (t) { return '<div class="mv-panel" data-tab="' + t[0] + '"></div>'; }).join("") + source(entry);
      var subs = {};
      subs.summary = makeView(entry, el.querySelector(".mv-slot-summary"), "summary");
      TABS.forEach(function (t) { subs[t[0]] = makeView(entry, el.querySelector('.mv-panel[data-tab="' + t[0] + '"]'), t[0]); });
      function show(tab) {
        el.querySelectorAll(".mv-tab").forEach(function (b) {
          var on = b.getAttribute("data-tab") === tab;
          b.classList.toggle("is-active", on); b.setAttribute("aria-selected", on ? "true" : "false");
        });
        el.querySelectorAll(".mv-panel").forEach(function (p) { p.hidden = p.getAttribute("data-tab") !== tab; });
        var v = subs[tab]; if (v && v.plot && !v.drawn) v.render();
      }
      el.querySelectorAll(".mv-tab").forEach(function (b) { b.addEventListener("click", function () { show(b.getAttribute("data-tab")); }); });
      view.afterMount = function () { show("flows"); };
    }
  };
  VIEWS.tabs = VIEWS.all;

  function makeView(entry, el, kind) {
    var view = { el: el, kind: kind, render: null };
    var fn = VIEWS[kind];
    if (!fn) { el.innerHTML = '<div class="mv-empty">Unknown view "' + xesc(kind) + '".</div>'; return view; }
    fn(entry, el, view);
    if (view.render) { entry.views.push(view); view.render(); }
    if (view.afterMount) view.afterMount();
    return view;
  }

  // ============================================== linked variables: page
  function findVar(name) {
    for (var i = 0; i < order.length; i++) { var e = models[order[i]]; if (e.model.varIndex[name]) return e; }
    return null;
  }
  function decorateProse() {
    var main = document.querySelector("main") || document.body;
    main.querySelectorAll("code").forEach(function (c) {
      if (c.closest("pre, a, .model-viewer, .mv-card, mjx-container, h1, h2, h3, h4, h5, h6")) return;
      var name = c.textContent.trim(), e = findVar(name);
      if (!e) return;
      var a = document.createElement("a");
      a.className = "mv-var"; a.href = "#" + varId(e, name);
      a.setAttribute("data-mv-src", e.src); a.setAttribute("data-mv-var", name);
      c.parentNode.insertBefore(a, c); a.appendChild(c);
    });
  }

  // Hover card: one per variable (or formula), typeset once and reused.
  var cards = {}, shown = null, hideTimer = null;
  function cardFor(entry, key, build) {
    var id = entry.src + "\u0000" + key;
    if (cards[id]) return cards[id];
    var el = document.createElement("div");
    el.className = "mv-card"; el.hidden = true; el.setAttribute("role", "tooltip");
    el.innerHTML = build();
    document.body.appendChild(el);
    cards[id] = el;
    typeset(el).then(function () { if (shown && shown.card === el) place(el, shown.target); });
    return el;
  }
  function varCardHTML(entry, v) {
    var h = '<div class="mv-card-h"><span class="mv-card-sym">' + texI(symTex(entry, v, false)) + "</span><code>" + xesc(v.name) + "</code>" +
            '<span class="mv-badge' + (v.isCalc ? " calc" : "") + '">' + (v.isCalc ? "calculated" : xesc(v.type || "input")) + "</span></div>";
    if (v.fullName) h += '<div class="mv-card-name">' + xesc(v.fullName) + "</div>";
    h += '<div class="mv-card-row"><b>Value</b> ' + valueText(v) + (unitText(v.unit) ? " " + unitText(v.unit) : "") +
         (boundsText(v) ? ' <span class="mv-muted">· range ' + boundsText(v) + "</span>" : "") + "</div>";
    if (v.isCalc) h += '<div class="mv-card-math">' + texD(displayTex(entry, v, false, 26, symTex(entry, v, false))) + "</div>";
    if (v.path) h += '<div class="mv-card-row mv-muted">From the simulator: <code>' + xesc(v.path) + "</code></div>";
    if (v.description && v.description !== v.fullName) h += '<div class="mv-card-desc">' + xesc(v.description) + "</div>";
    if (v.reference) h += '<div class="mv-card-ref">Source: ' + xesc(v.reference) + "</div>";
    if (document.getElementById(varId(entry, v.name))) h += '<div class="mv-card-hint">Click to go to its definition</div>';
    return h;
  }
  function place(card, target) {
    var r = target.getBoundingClientRect(), w = card.offsetWidth, h = card.offsetHeight, m = 8;
    var x = Math.max(m, Math.min(r.left, window.innerWidth - w - m));
    var y = r.bottom + 6;
    if (y + h > window.innerHeight - m) y = Math.max(m, r.top - h - 6);
    card.style.left = x + "px"; card.style.top = y + "px";
  }
  function targetInfo(t) {
    var src = t.getAttribute("data-mv-src"), name = t.getAttribute("data-mv-var"), formula = t.getAttribute("data-mv-formula");
    if (!src) {
      var href = t.getAttribute("href") || "", hit = idMap[href.replace(/^#/, "")];
      if (!hit) return null;
      src = hit.src; name = hit.name;
    }
    var entry = models[src];
    return entry ? { entry: entry, name: name, formula: formula } : null;
  }
  function showCard(t) {
    var info = targetInfo(t);
    if (!info) return;
    clearTimeout(hideTimer);
    var card;
    if (info.name) {
      var v = info.entry.model.varIndex[info.name];
      if (!v) return;
      card = cardFor(info.entry, "v:" + info.name, function () { return varCardHTML(info.entry, v); });
    } else if (info.formula) {
      card = cardFor(info.entry, "f:" + info.formula, function () {
        return '<div class="mv-card-name">Calculated from</div><div class="mv-card-math">' + texI(formulaStringTex(info.entry, info.formula, false)) + "</div>";
      });
    }
    if (!card) return;
    if (shown && shown.card !== card) shown.card.hidden = true;
    card.hidden = false;
    place(card, t);
    shown = { card: card, target: t };
  }
  function hideCard() {
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function () { if (shown) { shown.card.hidden = true; shown = null; } }, 80);
  }
  var LINK_SEL = 'a.mv-var, .mv-val, mjx-container a[href^="#mv-var-"]';
  function bindLinks() {
    document.addEventListener("mouseover", function (e) {
      var t = e.target.closest && e.target.closest(LINK_SEL);
      if (t) showCard(t);
    });
    document.addEventListener("mouseout", function (e) {
      var t = e.target.closest && e.target.closest(LINK_SEL);
      if (t && !(e.relatedTarget && t.contains(e.relatedTarget))) hideCard();
    });
    document.addEventListener("focusin", function (e) { var t = e.target.closest && e.target.closest(LINK_SEL); if (t) showCard(t); });
    document.addEventListener("focusout", function (e) { var t = e.target.closest && e.target.closest(LINK_SEL); if (t) hideCard(); });
    window.addEventListener("scroll", function () { if (shown) { shown.card.hidden = true; shown = null; } }, { passive: true });
    document.addEventListener("click", function (e) {
      var t = e.target.closest && e.target.closest('a[href^="#mv-var-"], a[href^="#mv-eq-"]');
      if (!t) return;
      var id = (t.getAttribute("href") || "").slice(1), dest = document.getElementById(id);
      if (!dest) { e.preventDefault(); return; }
      setTimeout(function () {
        dest.classList.remove("mv-flash"); void dest.offsetWidth; dest.classList.add("mv-flash");
        setTimeout(function () { dest.classList.remove("mv-flash"); }, 1900);
      }, 30);
    });
  }

  // ================================================================ start
  var api = { toTexLines: toTexLines, vlen: vlen, solve: solve, readModel: readModel, readUnits: readUnits, composite: composite, streamCP: streamCP, sHi: sHi, sLo: sLo,
              parseFormula: parseFormula, toTex: toTex, evalFormula: evalFormula, prettySym: prettySym, buildFlows: buildFlows,
              streamTable: streamTable, streamWarnings: streamWarnings, nice: nice, ticks: ticks, compositionHTML: compositionHTML };
  if (window.__mvTestHook) window.__mvTestHook(api);

  var roots = document.querySelectorAll(".model-viewer");
  if (!roots.length) return;
  try { var bodyFont = window.getComputedStyle(document.body).fontFamily; if (bodyFont) FONT = bodyFont; } catch (e) { /* keep the default */ }

  // Read every embedded model first: views of one file share a single copy.
  roots.forEach(function (r) {
    var src = r.getAttribute("data-src") || "", node = r.querySelector('script[type="application/json"]');
    if (!node || models[src]) return;
    try {
      var entry = { src: src, model: readModel(JSON.parse(node.textContent)), state: { unit: 0, f: 1 }, views: [] };
      entry.prefix = order.length ? (order.length + 1) + "-" : "";
      models[src] = entry; order.push(src);
      entry.model.vars.forEach(function (v) { idMap[varId(entry, v.name)] = { src: src, name: v.name }; });
    } catch (e) {
      console.error("model-viewer:", e);
    }
  });

  roots.forEach(function (r) {
    var src = r.getAttribute("data-src") || "", entry = models[src];
    var kind = r.getAttribute("data-view") || "all";
    if (!entry) { r.innerHTML = '<div class="mv-empty">Could not read ' + xesc(src) + ".</div>"; return; }
    if (!entry.model.units.length && ["summary", "flows", "streams", "cc", "gcc", "unit", "all", "tabs"].indexOf(kind) >= 0) {
      r.innerHTML = '<div class="mv-empty">No units found in ' + xesc(src) + ".</div>"; return;
    }
    var host = document.createElement("div");
    r.appendChild(host);
    try { makeView(entry, host, kind); }
    catch (e) {
      console.error("model-viewer:", e);
      host.innerHTML = '<div class="mv-empty">The model viewer could not render this view.</div>';
    }
  });

  decorateProse();
  bindLinks();
  if (location.hash && reveal(decodeURIComponent(location.hash.slice(1))))
    document.getElementById(decodeURIComponent(location.hash.slice(1))).scrollIntoView();

  function redrawPlots() { order.forEach(function (s) { models[s].views.forEach(function (v) { if (v.plot) v.render(); }); }); }
  // Text drawn on a canvas keeps the fallback font if the page font arrives later.
  if (document.fonts && document.fonts.load) {
    var family = FONT.split(",")[0].trim();
    Promise.all([document.fonts.load("400 12px " + family), document.fonts.load("700 12px " + family)])
      .then(function (got) { if (got[0].length || got[1].length) redrawPlots(); }, function () {});
  }
  var resizeTimer = null, lastW = window.innerWidth;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      if (window.innerWidth === lastW) return;
      lastW = window.innerWidth;
      redrawPlots();
    }, 150);
  });
});
</script>
