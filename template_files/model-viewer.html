<!--
  Model viewer: renders every <div class="model-viewer"> left in the page by the
  model-viewer shortcode (model-viewer.lua), from the model's JSON description.

  A model page places one view per section:
    card        model card from the metadata
    summary     key figures, with the unit selector and the scale factor f
    flows       black-box diagram: connectors in and out, heat demand and release
    equations   every calculated variable as an equation, from its JSON formula
    variables   input and calculated variables
    unit        unit description, connectors, equipment and operating costs
    streams     heat stream table (hot rows red, cold rows blue) and data checks
    cc / gcc    composite curves / grand composite curve
    references  references listed in the metadata
  Without a view the shortcode renders a compact tabbed widget.

  Variables are linked everywhere: inline code in the page that names a
  variable, table values that come from a variable's formula, and symbols in
  rendered formulas show a hover card with the definition, and link to the
  variable's row in the variables table.

  Reads both JSON layouts of the database: the Excel export (METADATA,
  VARIABLES, UNITS: {name: {...}}) and the Lua export (header, variables,
  units: [...]). The pinch cascade and the plots are ported from the "Model
  Representation and Integration" prototype.
-->

      var cells = [], w = 0, excess = wrap.scrollWidth - wrap.clientWidth;
      wrap.querySelectorAll("td[data-mv-def]").forEach(function (td) {
        var m = td.querySelector("mjx-container"), mm = m && m.querySelector("mjx-math"), mw = mm ? mm.getBoundingClientRect().width : 0;   // the formula, not its full-width box
        if (mw && !(m.getAttribute("data-fs0") && parseFloat(m.style.fontSize) <= MIN.def[1] * parseFloat(m.getAttribute("data-fs0")) + 0.5)) { cells.push([td, mw]); w = Math.max(w, mw); }

        el.innerHTML = '<div class="mv-ccard"><div class="mv-int-sec">' + verb + "</div>" +
          '<div class="mv-crow-flow">' + chip(P.p) + '<span class="mv-crow-arr">' + (P.merge ? "+" : "→") + "</span>" + chip(P.q) + "</div>" +
          (same ? "" : '<div class="mv-ccard-f">1 ' + xesc(ua) + " = " + (guess ? "<b>" + nice(guess.f) + "</b>" : '<input type="number" class="mv-int-factor" min="0" step="any" placeholder="?">') + " " + xesc(ub) +
            ' <span class="mv-pill" title="' + (guess ? "fixed: it does not depend on the composition" : "the factor depends on the composition, for example through its density or heating value; take it from the models' data") + '">' +
            (guess ? xesc(guess.why) : "depends on the composition") + "</span></div>" + '<div class="mv-ccard-res"></div>') +
          '<div class="mv-crow-pills"></div><div class="mv-ccard-btns"><button type="button" class="mv-btn is-primary" data-act="connect">' + verb +
          '</button><button type="button" class="mv-btn" data-act="cancel">Cancel</button></div></div>';
        var inp = el.querySelector(".mv-int-factor"), res = el.querySelector(".mv-ccard-res"), btn = el.querySelector('[data-act="connect"]'), dEl = el.querySelector(".mv-crow-pills");
        var show = function () {
          var f = same ? 1 : guess ? guess.f : parseFloat(inp.value), ok = f > 0, d = compat(P.p, P.q, P.merge);
          btn.disabled = !ok;
          if (res) res.innerHTML = ok ? nice(P.p.q) + " " + xesc(ua) + ' <span class="mv-crow-arr">→</span> <b>' + nice(P.p.q * f) + " " + xesc(ub) + "</b>" : '<span class="mv-muted">' + nice(P.p.q) + " " + xesc(ua) + " → ? " + xesc(ub) + "</span>";
          dEl.innerHTML = pills(d);
        };
        if (inp) inp.addEventListener("input", show); show();
      } else if (pendingPort !== null) {
        var it = flowsEl._items[pendingPort] || {};
        el.innerHTML = '<div class="mv-ccard is-pick">' + chip(it) + '<span class="mv-muted">' + (it.dir === "in" ? "Click a highlighted product that supplies it, or a feed to merge with" : "Click a highlighted feed it goes to, or a product to merge with") +
                       '</span><button type="button" class="mv-btn" data-act="cancel">Cancel</button>' +
                       (refused ? '<div class="mv-int-refused">Can’t ' + (refused.merge ? "merge " : "connect ") + "<b>" + chemHTML(refused.p.c.name) + "</b> of " + xesc(refused.p.model) + (refused.merge ? " with " : " to ") +
                                  "<b>" + chemHTML(refused.q.c.name) + "</b> of " + xesc(refused.q.model) + ": " + refused.why.map(function (x) { return chemHTML(x.l); }).join("; ") + ".</div>" : "") + "</div>";
      }
      else el.innerHTML = "";
    }
    // A factor from one flow unit to another when it does not depend on the composition (or the flow is water)
    var SCALE = { "kg/h": ["m", 1], "t/h": ["m", 1000], "kg/s": ["m", 3600], "t/d": ["m", 1000 / 24], "kg/d": ["m", 1 / 24],
                  "kW": ["P", 1], "MW": ["P", 1000], "W": ["P", 0.001], "GW": ["P", 1e6],
                  "m³/h": ["V", 1], "m³/s": ["V", 3600], "m³/d": ["V", 1 / 24], "l/h": ["V", 0.001], "L/h": ["V", 0.001], "l/s": ["V", 3.6], "L/s": ["V", 3.6] };
    function factorGuess(p, q) {
      var a = SCALE[normUnit(p.idn.unit)], b = SCALE[normUnit(q.idn.unit)];
      if (!a || !b) return null;
      if (a[0] === b[0]) return { f: Number((a[1] / b[1]).toPrecision(12)), why: "unit conversion" };
      var water = [p, q].every(function (it) { return !it.idn.sp || it.idn.sp === "H2O"; }) && [p, q].some(function (it) { return it.idn.sp === "H2O"; });
      if (water && a[0] === "m" && b[0] === "V") return { f: Number((a[1] / 1000 / b[1]).toPrecision(12)), why: "water at 1,000 kg/m³" };
      if (water && a[0] === "V" && b[0] === "m") return { f: Number((a[1] * 1000 / b[1]).toPrecision(12)), why: "water at 1,000 kg/m³" };
      return null;
    }
    // Every way two connectors differ in what decides a match (unit, composition, phase, pressure), naming the model when one leaves a value out
    function mainComp(sp) { return sp ? compName(sp).replace(/ mixture$/, "") : null; }
    function diffs(p, q) {
      var out = [], A = p.idn, B = q.idn, e1 = A.basis === "electricity", e2 = B.basis === "electricity";
      if (A.unit !== B.unit) { var g = factorGuess(p, q);
        out.push({ kind: "unit", s: prettyUnit(A.unit) + " → " + prettyUnit(B.unit), l: "different units; " + (g ? g.why : "the factor depends on the composition") }); }
      if (e1 || e2) { if (e1 !== e2) out.push({ kind: "elec", s: "electricity ↔ material", l: (e1 ? p : q).c.name + " is electricity and " + (e1 ? q : p).c.name + " is a material flow" }); return out; }
      var m1 = mainComp(A.sp), m2 = mainComp(B.sp);
      [[p, "sp", "composition"], [p, "ph", "phase"], [p, "p", "pressure"], [p, "T", "temperature"]].forEach(function (f) {
        var a = A[f[1]], b = B[f[1]], miss = function (v) { return v === null || v === undefined || v === ""; };
        if (miss(a) || miss(b)) [p, q].forEach(function (it) { if (miss(it.idn[f[1]])) out.push({ kind: "miss", m: it.model, f: f[2], s: it.model + " gives no " + f[2], l: it.c.name + " of " + it.who + " does not state its " + f[2] }); });
        else if (f[1] === "sp" && A.cd && B.cd) {
          var sim = similarity(A.cd, B.cd), pc = Math.floor(sim.v * 1000) / 10;
          if (sim.v < SIM_BLOCK) out.push({ kind: "comp", s: "composition " + (m1 !== m2 ? m1 + " vs " + m2 : pc + " % alike"), l: "different composition: " + (m1 !== m2 ? m1 + " vs " + m2 + ", " : "") + "only " + pc + " % alike" });
          else if (sim.v < SIM_NOTE) out.push({ kind: "minor", s: "composition " + pc + " % alike", l: "the compositions are " + pc + " % alike" });
          if (sim.note) out.push({ kind: "minor", s: "fraction basis unclear", l: sim.note });
        }
        else if (f[1] === "ph" && a !== b) out.push({ kind: "phase", s: a + " → " + b, l: "the change of phase is not part of either model" });
        else if (f[1] === "p" && Math.abs(a - b) > 1e-9) out.push({ kind: "pres", s: nice(a) + " → " + nice(b) + " bar", l: "the " + (a < b ? "compression" : "expansion") + " between them is not part of either model" });
        else if (f[1] === "T" && Math.abs(a - b) > 1e-9) out.push({ kind: "temp", s: nice(a) + " → " + nice(b) + " °C", l: "the " + (a < b ? "heating" : "cooling") + " between them is not part of either model" });
      });
      return out;
    }
    // What may be joined: blocked when the compositions differ, electricity meets a material, a unit would feed itself, or both are one flow already
    function compat(p, q, merge) {
      var d = diffs(p, q), hard = d.filter(function (x) { return x.kind === "comp" || x.kind === "elec"; }), soft = d.filter(function (x) { return hard.indexOf(x) < 0; });
      // without a composition there is nothing to check against, so only a flow of the same name may be joined
      var e = p.idn.basis === "electricity" || q.idn.basis === "electricity", sameName = p.c.name.trim().toLowerCase() === q.c.name.trim().toLowerCase();
      if (!e && !sameName) [p, q].forEach(function (it) {
        if (!it.idn.sp) hard.push({ s: it.model + " gives no composition", l: it.c.name + " of " + it.model + " does not state its composition, so it can only be joined to a flow of the same name" }); });
      if (!merge && p.node === q.node) hard.push({ s: "same unit", l: "a unit cannot supply itself" });
      if (p.fid === q.fid) hard.push({ s: "already one flow", l: "these are already the same flow" });
      return { hard: hard, soft: soft };
    }
    // the product and the feed (or the two of a merge) when sel is selected and it clicked
    function orient(sel, it) { var merge = sel.dir === it.dir; return merge || sel.dir === "out" ? { p: sel, q: it, merge: merge } : { p: it, q: sel, merge: false }; }
    // reasons as they are read: differences as they are ("30 → 1 bar"), values a model leaves out gathered per model
    // ("Methanation gives no pressure or temperature")
    function tidy(list) {
      var out = [], byModel = {};
      list.forEach(function (x) {
        if (x.kind !== "miss") return out.push(x);
        var g = byModel[x.m]; if (!g) { g = byModel[x.m] = { kind: "miss", m: x.m, fields: [] }; out.push(g); }
        if (g.fields.indexOf(x.f) < 0) g.fields.push(x.f);
      });
      out.forEach(function (g) {
        if (g.kind !== "miss" || !g.fields) return;
        var f = g.fields, words = f.length < 2 ? f[0] : f.slice(0, -1).join(", ") + " or " + f[f.length - 1];
        g.s = g.m + " gives no " + words; g.l = g.s + ", so it cannot be compared";
      });
      return out;
    }
    function reasonText(list) { return tidy(list).map(function (x) { return x.s; }).join("; "); }
    function pills(d) {
      return tidy(d.hard).map(function (t) { return '<span class="mv-pill is-hard" title="' + xesc(t.l) + '">⚠ ' + chemHTML(t.s) + "</span>"; }).join("") +
             tidy(d.soft).map(function (t) { return '<span class="mv-pill" title="' + xesc(t.l) + '">' + chemHTML(t.s) + "</span>"; }).join("");
    }
    function chip(it) {
      return '<span class="mv-chip" title="' + xesc(it.c.name + " · " + it.who) + '"><span class="mv-chip-n">' + chemHTML(it.c.name) +
             ' <span class="mv-chip-u">' + xesc(prettyUnit(it.idn.unit)) + '</span></span><span class="mv-chip-w">' + xesc(it.who) + "</span></span>";
    }
    function crow(cls, tag, a, arr, b, pl, act) {
      return '<tr class="mv-crow"><td>' + a + '</td><td class="mv-crow-arr">' + arr + "</td><td>" + b + '</td><td class="mv-crow-pills">' +
             (tag ? '<span class="mv-int-tag ' + cls + '">' + tag + "</span>" : "") + (pl || (tag ? "" : '<span class="mv-muted">–</span>')) + '</td><td class="mv-crow-act">' + act + "</td></tr>";
    }
    function ctable(head, rows) {
      return '<div class="mv-ctable-wrap">' + TOPEN + ' class="mv-ctable"><colgroup><col style="width:25%"><col style="width:1.8rem"><col style="width:25%"><col><col style="width:5.6rem"></colgroup><thead><tr><th>From</th><th></th><th>To</th><th>' + head + "</th><th></th></tr></thead><tbody>" +
             rows.join("") + "</tbody>" + TCLOSE + "</div>";
    }
    // connect a product to a feed, or merge two products (or two feeds) into one flow: p's flow becomes q's
    function connect(p, q, factor, merge) {
      rules = rules.filter(function (r) { return r.from !== p.idn.key; });
      rules.push({ from: p.idn.key, to: q.idn.key, factor: factor, kind: merge ? "merge" : "user", a: chip(p), b: chip(q), ua: prettyUnit(p.idn.unit), ub: prettyUnit(q.idn.unit),
                   doubts: compat(p, q, merge) });
    }
    flowsEl.addEventListener("mouseover", function (e) {
      var tr = e.target.closest && e.target.closest(".mv-crow"), b = tr && tr.querySelector("[data-accept]"), i = b ? +b.getAttribute("data-accept") : null;
      if (i === flowsEl._hover || !flowsEl._drawMap) return;
      flowsEl._hover = i; flowsEl._drawMap(i === null ? flowsEl._baseShown : flowsEl._baseShown.concat([i]));
    });
    flowsEl.addEventListener("mouseleave", function () { if (flowsEl._drawMap && flowsEl._hover !== null) { flowsEl._hover = null; flowsEl._drawMap(flowsEl._baseShown); } });
    flowsEl.addEventListener("click", function (e) {
      var t = e.target, g, v, items = flowsEl._items || [];
      if ((v = t.getAttribute && t.getAttribute("data-undo")) !== null && v !== undefined) {
        if (v.indexOf("off:") === 0) delete autoOff[v.slice(4)]; else rules.splice(+v, 1);
        pendingSel = null; pendingConnect = null; refused = null; update(false); return;
      }
      if ((v = t.getAttribute && t.getAttribute("data-act")) !== null && v !== undefined) {
        if (v === "connect" && pendingConnect) { var fi = flowsEl.querySelector(".mv-int-factor"), f = fi ? parseFloat(fi.value) : 1; if (!(f > 0)) return; connect(pendingConnect.p, pendingConnect.q, f, pendingConnect.merge); }
        pendingConnect = null; pendingSel = null; refused = null; update(false); return;
      }
      if ((g = t.closest && t.closest("[data-sugg],[data-accept]"))) {
        var s = flowsEl._sugg[+(g.getAttribute("data-sugg") || g.getAttribute("data-accept"))];
        if (s.p.idn.unit !== s.q.idn.unit) { pendingConnect = { p: s.p, q: s.q, merge: false }; update(false); return; }   // the factor first
        connect(s.p, s.q, 1, false); update(false); return;
      }
      if ((g = t.closest && t.closest("[data-bnd]"))) {
        var R = flowsEl._bnd[+g.getAttribute("data-bnd")], ids = R.ports.map(function (it) { return it.idn.key; });
        rules = rules.filter(function (r) { return !(r.kind === "merge" && (ids.indexOf(r.from) >= 0 || ids.indexOf(r.to) >= 0)); });
        update(false); return;
      }
      if ((g = t.closest && t.closest("[data-link]"))) {
        var l = flowsEl._links[+g.getAttribute("data-link")];
        if (l.kind === "user") rules = rules.filter(function (r) { return r.from !== l.from.idn.key && r.from !== l.to.idn.key; });
        else autoOff[l.kind === "name" || !l.from.idn.sig ? "key:" + l.from.idn.key : "sig:" + l.from.idn.sig] = { a: chip(l.from), b: chip(l.to) };
        update(false); return;
      }
      if ((v = t.getAttribute && t.getAttribute("data-port")) !== null && v !== undefined) {
        var it = items[+v];
        refused = null;
        if (pendingPort === null || pendingPort === it.k) { pendingSel = pendingPort === it.k ? null : { c: it.c, node: it.node }; pendingConnect = null; update(false); return; }
        var o = orient(items[pendingPort], it), p = o.p, q = o.q, merge = o.merge, dd = compat(p, q, merge);
        if (dd.hard.length) { refused = { p: p, q: q, merge: merge, why: dd.hard }; update(false); return; }
        pendingSel = null;
        if (p.idn.unit === q.idn.unit && !dd.soft.length) { connect(p, q, 1, merge); update(false); }
        else { pendingConnect = { p: p, q: q, merge: merge }; update(false); }
      }
    });
    function findUnit(key) { var p = String(key).split(":"), a = added.filter(function (z) { return String(z.id) === p[0]; })[0]; return a && a.units[+p[1]]; }
    unitsEl.addEventListener("click", function (e) {
      var k = e.target.getAttribute && e.target.getAttribute("data-side"); if (!k) return;
      var x = findUnit(k); x.side = x.side === "utility" ? "process" : "utility"; e.target.textContent = x.side; update(false);
    });
    unitsEl.addEventListener("change", function (e) {
      var k = e.target.getAttribute("data-on"); if (k === null) return;
      findUnit(k).on = e.target.checked; update(false);
    });
    unitsEl.addEventListener("input", function (e) {
      var k = e.target.getAttribute("data-f"); if (k === null) return;
      var v = parseFloat(e.target.value); if (!isFinite(v) || v < 0) return;
      findUnit(k).f = v; update(false);
    });
    var lastW = window.innerWidth;
    window.addEventListener("resize", function () { if (window.innerWidth !== lastW) { lastW = window.innerWidth; update(false); } });
    update(true);
  }
  document.querySelectorAll(".model-integration").forEach(mountIntegration);

  var roots = document.querySelectorAll(".model-viewer");
  if (!roots.length) return;
  try { var bodyFont = window.getComputedStyle(document.body).fontFamily; if (bodyFont) FONT = bodyFont; } catch (e) { /* keep the default */ }

  // Read every embedded model first: views of one file share a single copy.
  roots.forEach(function (r) {
    var src = r.getAttribute("data-src") || "", node = r.querySelector('script[type="application/json"]');
    if (!node || models[src]) return;
    try {
      var entry = { src: src, model: readModel(JSON.parse(node.textContent)), state: { unit: 0, f: 1 }, views: [] };
      entry.prefix = order.length ? (order.length + 1) + "-" : "";
      models[src] = entry; order.push(src);
      entry.model.vars.forEach(function (v) { idMap[varId(entry, v.name)] = { src: src, name: v.name }; });
    } catch (e) {
      console.error("model-viewer:", e);
    }
  });

  roots.forEach(function (r) {
    var src = r.getAttribute("data-src") || "", entry = models[src];
    var kind = r.getAttribute("data-view") || "all";
    if (!entry) { r.innerHTML = '<div class="mv-empty">Could not read ' + xesc(src) + ".</div>"; return; }
    if (!entry.model.units.length && ["summary", "flows", "streams", "cc", "gcc", "unit", "all", "tabs"].indexOf(kind) >= 0) {
      r.innerHTML = '<div class="mv-empty">No units found in ' + xesc(src) + ".</div>"; return;
    }
    var host = document.createElement("div");
    r.appendChild(host);
    try { makeView(entry, host, kind); }
    catch (e) {
      console.error("model-viewer:", e);
      host.innerHTML = '<div class="mv-empty">The model viewer could not render this view.</div>';
    }
  });

  decorateProse();
  bindLinks();
  linkFigures();
  if (location.hash && reveal(decodeURIComponent(location.hash.slice(1))))
    document.getElementById(decodeURIComponent(location.hash.slice(1))).scrollIntoView();

  function redrawPlots() { order.forEach(function (s) { models[s].views.forEach(function (v) { if (v.plot) v.render(); }); }); }
  // Text drawn on a canvas keeps the fallback font if the page font arrives later.
  if (document.fonts && document.fonts.load) {
    var family = FONT.split(",")[0].trim();
    Promise.all([document.fonts.load("400 12px " + family), document.fonts.load("700 12px " + family)])
      .then(function (got) { if (got[0].length || got[1].length) redrawPlots(); }, function () {});
  }
  var resizeTimer = null, lastW = window.innerWidth;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      if (window.innerWidth === lastW) return;
      lastW = window.innerWidth;
      redrawPlots();
    }, 150);
  });
});
</script>
