# Renders the Quarto website and publishes _book/ on GitHub Pages.
#
# Runs on every push to main, and on demand from the repository's Actions tab
# ("Run workflow"). One-time setup: Settings > Pages > Build and deployment >
# Source: "GitHub Actions". Until Pages is enabled, the deploy job fails and
# nothing is published.

name: Publish the site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time: a newer run waits, an ongoing one is never cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.19          # the version the site is built with locally

      - name: Render the site
        run: quarto render

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
