# Deployment is triggered by a production tag, never by a plain push.
#
#   git tag prod-2026-09-04
#   git push origin prod-2026-09-04
#
# Only tags matching prod-YYYY-MM-DD create a pipeline (see workflow.rules
# below). Pushes to main — including to the default branch — create no
# pipeline at all, so the published website only ever changes when someone
# deliberately tags a release.
#
# To re-deploy the same day, append a suffix: prod-2026-09-04-2,
# prod-2026-09-04-hotfix, ... Any -<word> suffix is accepted.
#
# ---------------------------------------------------------------------------
# The bookdown pipeline was:
#
#   include:
#     - project: 'ipese-it/gitlabci-templates'
#       file: 'Bookdown.gitlab-ci-templates.yml'
#       inputs: { pdf: false }
#
# If ipese-it/gitlabci-templates ships a Quarto template, replace everything
# below with the equivalent include. Otherwise this standalone job works.
#
# Uses the official Quarto image (Quarto + a TinyTeX kept in sync with it)
# instead of the old ipeseserv3.epfl.ch rmarkdown image, whose bundled
# TeX Live (2025) is older than CTAN's current repository and fails to
# fetch packages during PDF rendering.

workflow:
  rules:
    # Production tag: prod-YYYY-MM-DD
    - if: $CI_COMMIT_TAG =~ /^prod-\d{4}-\d{2}-\d{2}(-\w+)?$/
    # Anything else (branch pushes, merge requests, other tags): no pipeline.
    - when: never

stages:
  - build
  - deploy

build:gitbook:
  stage: build
  image: ghcr.io/quarto-dev/quarto-full:latest
  script:
    - ./compileAll.sh
  artifacts:
    paths:
      - _book
    expire_in: 1 hour

deploy:rsync:
  stage: deploy
  image: alpine:latest
  needs:
    - job: build:gitbook
      artifacts: true
  variables:
    # Defaults only — the real values come from the project's CI/CD settings,
    # which take precedence over variables declared here.
    SSH_PRIVATE_KEY: SECURE
    SSH_HOST_KEY: SECURE
    SSH_USER_HOST_LOCATION: SECURE
  before_script:
    - apk update && apk add rsync
    - 'which ssh-agent || ( apk update && apk add openssh-client )'
    - mkdir -p ~/.ssh
    - eval $(ssh-agent -s)
    - echo "${SSH_PRIVATE_KEY}" | ssh-add -
    - echo "${SSH_HOST_KEY}" > ~/.ssh/known_hosts
  script:
    - rsync -hrvz --delete _book/ "${SSH_USER_HOST_LOCATION}"
  environment:
    name: production
