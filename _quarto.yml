project:
  type: website
  output-dir: _book

  # The overview table of each section page is computed from its category
  # pages before every render (see the script).
  pre-render: python3 SupportCode/category_overview.py

  # Only the pages below are rendered. Model folders also hold supplementary
  # material (.lua, .json, .xlsm, deprecated model files, ...) that Quarto
  # must not try to render.
  render:
    - index.qmd
    - 00-TaskDescription.qmd
    - 01-ParticipationRules.qmd
    - 02-HowToUseThisDatabase.qmd
    - "*/index.qmd"
    - "*/*/index.qmd"
    - "*/*/*/index.qmd"

website:
  title: "IETS Task XXIV"
  favicon: template_files/favicon.png

  search: true
  page-navigation: true
  page-footer:
    center: "©2026 - IETS Task XXIV"

  # One section per top-level folder; one page per model folder. A section's
  # href is its landing page. Sections nest, e.g. a sector within a part.
  sidebar:
    logo: template_files/iets-logo.png
    title: "Task XXIV"
    style: docked
    collapse-level: 1
    contents:
      - href: index.qmd
        text: "About this database"

      - section: "Task XXIV"
        href: 0-TaskXXIVDescription/index.qmd
        contents:
          - 00-TaskDescription.qmd
          - 01-ParticipationRules.qmd
          - 02-HowToUseThisDatabase.qmd

      # Each section holds categories; a category with documented or
      # placeholder model pages is itself a section, the others are a page.
      - section: "Energy technologies"
        href: 1-EnergyTechnologies/index.qmd
        contents:
          - section: "Thermal conversion"
            href: 1-EnergyTechnologies/ThermalConversion/index.qmd
            contents:
              - 1-EnergyTechnologies/ThermalConversion/FurnaceNG/index.qmd
          - section: "Power and utilities"
            href: 1-EnergyTechnologies/PowerAndUtilities/index.qmd
            contents:
              - 1-EnergyTechnologies/PowerAndUtilities/CoolingTower/index.qmd
              - 1-EnergyTechnologies/PowerAndUtilities/Refrigerator/index.qmd
          - section: "Heat recovery and upgrade"
            href: 1-EnergyTechnologies/HeatRecoveryAndUpgrade/index.qmd
            contents:
              - 1-EnergyTechnologies/HeatRecoveryAndUpgrade/HeatPump/index.qmd
          - 1-EnergyTechnologies/MassAndEnergyStorage/index.qmd
          - 1-EnergyTechnologies/Renewables/index.qmd
          - 1-EnergyTechnologies/AirSeparation/index.qmd
          - 1-EnergyTechnologies/EnergySystemsAndGrids/index.qmd

      - section: "Decarbonization technologies"
        href: 2-DecarbTechnologies/index.qmd
        contents:
          - section: "Electrochemical"
            href: 2-DecarbTechnologies/Electrochemical/index.qmd
            contents:
              - 2-DecarbTechnologies/Electrochemical/HighTElectrolysis/index.qmd
              - 2-DecarbTechnologies/Electrochemical/LowTElectrolysis/index.qmd
          - section: "Gas upgrading and syngas"
            href: 2-DecarbTechnologies/GasUpgradingAndSyngas/index.qmd
            contents:
              - 2-DecarbTechnologies/GasUpgradingAndSyngas/Methanation/index.qmd
          - section: "CO₂ capture, use and sequestration"
            href: 2-DecarbTechnologies/CO2Capture/index.qmd
            contents:
              - 2-DecarbTechnologies/CO2Capture/CcsAmines/index.qmd

      - section: "Industrial processes"
        href: 3-IndustrialProcesses/index.qmd
        contents:
          - 3-IndustrialProcesses/HeavyIndustry/index.qmd
          - section: "Petrochemical"
            href: 3-IndustrialProcesses/Petrochemical/index.qmd
            contents:
              - 3-IndustrialProcesses/Petrochemical/MethanolToOlefins/index.qmd
          - 3-IndustrialProcesses/NitrogenChemistry/index.qmd
          - 3-IndustrialProcesses/PrecisionIndustries/index.qmd
          - 3-IndustrialProcesses/UrbanAndDigital/index.qmd
          - section: "Oxygenates and commodity chemicals"
            href: 3-IndustrialProcesses/OxygenatesAndChemicals/index.qmd
            contents:
              - 3-IndustrialProcesses/OxygenatesAndChemicals/Methanol/index.qmd
          - 3-IndustrialProcesses/SyntheticFuelsAndBiofuels/index.qmd
          - 3-IndustrialProcesses/FoodAndBeverage/index.qmd
          - 3-IndustrialProcesses/BioAndWaste/index.qmd

# {{< model-viewer JSON/Model.json >}} on a model page renders that model's
# key figures, block flow diagram and composite curves (HTML only).
shortcodes:
  - template_files/model-viewer.lua

# A page's leading "# Title" heading is its title (see h1-title.lua).
filters:
  - template_files/h1-title.lua

language:
  search-text-placeholder: "Search"

crossref:
  eq-prefix: "Eq."
  fig-prefix: "Fig."
  tbl-prefix: "Table"
  sec-prefix: "Sec."

format:
  html:
    theme:
      - cosmo
      - template_files/theme.scss
    include-after-body:
      - template_files/ipese-footer.html
      - template_files/model-viewer.html
    toc: true
    toc-depth: 3
    number-sections: false
    code-copy: true
    fig-align: center

