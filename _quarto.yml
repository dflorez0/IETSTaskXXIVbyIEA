project:
  type: website
  output-dir: _book

  # Only the pages below are rendered. Model folders also hold supplementary
  # material (.lua, .json, .xlsm, deprecated model files, ...) that Quarto
  # must not try to render.
  render:
    - index.qmd
    - 00-TaskDescription.qmd
    - 01-ParticipationRules.qmd
    - 02-HowToUseThisDatabase.qmd
    - "*/index.qmd"
    - "*/*/index.qmd"
    - "*/*/*/index.qmd"

website:
  title: "IETS Task XXIV"
  favicon: template_files/iets-logo.png

  search: true
  page-navigation: true
  page-footer:
    center: "©2026 - IETS Task XXIV"

  # One section per top-level folder; one page per model folder. A section's
  # href is its landing page. Sections nest, e.g. a sector within a part.
  sidebar:
    logo: template_files/iets-logo.png
    title: "Task XXIV"
    style: docked
    collapse-level: 1
    contents:
      - href: index.qmd
        text: "About this database"

      - section: "Task XXIV"
        href: 0-TaskXXIVDescription/index.qmd
        contents:
          - 00-TaskDescription.qmd
          - 01-ParticipationRules.qmd
          - 02-HowToUseThisDatabase.qmd

      - section: "Energy technologies"
        href: 1-EnergyTechnologies/index.qmd
        contents:
          - 1-EnergyTechnologies/CoolingTower/index.qmd
          - 1-EnergyTechnologies/FurnaceNG/index.qmd
          - 1-EnergyTechnologies/HeatPump/index.qmd
          - 1-EnergyTechnologies/Refrigerator/index.qmd

      - section: "Decarbonisation technologies"
        href: 2-DecarbTechnologies/index.qmd
        contents:
          - 2-DecarbTechnologies/CcsAmines/index.qmd
          - 2-DecarbTechnologies/HighTElectrolysis/index.qmd
          - 2-DecarbTechnologies/LowTElectrolysis/index.qmd

      - section: "Industrial processes"
        href: 3-IndustrialProcesses/index.qmd
        contents:
          - section: "Chemical sector"
            href: 3-IndustrialProcesses/ChemicalSector/index.qmd
            contents:
              - 3-IndustrialProcesses/ChemicalSector/MethanolToOlefins/index.qmd
          - 3-IndustrialProcesses/FoodSector/index.qmd

# {{< model-viewer JSON/Model.json >}} on a model page renders that model's
# key figures, block flow diagram and composite curves (HTML only).
shortcodes:
  - template_files/model-viewer.lua

# A page's leading "# Title" heading is its title (see h1-title.lua).
filters:
  - template_files/h1-title.lua

crossref:
  eq-prefix: "Eq."
  fig-prefix: "Fig."
  tbl-prefix: "Table"
  sec-prefix: "Sec."

format:
  html:
    theme:
      - cosmo
      - template_files/theme.scss
    include-after-body:
      - template_files/ipese-footer.html
      - template_files/model-viewer.html
    toc: true
    toc-depth: 3
    number-sections: false
    code-copy: true
    fig-align: center

